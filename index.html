y:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:#9fb3c8;text-transform:uppercase;margin-bottom:10px;}  .filter-select{position:relative;margin-bottom:8px;}  .filter-select select{width:100%;appearance:none;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);color:#e6edf5;font-size:12.5px;padding:9px 10px;border-radius:7px;font-family:inherit;cursor:pointer;}  .filter-select select:hover{background:rgba(255,255,255,.1);}  .filter-select::after{content:"⌄";position:absolute;right:10px;top:8px;color:#9fb3c8;pointer-events:none;font-size:13px;}  .filter-note{font-size:10.5px;color:#7d93ac;margin-top:10px;line-height:1.5;}   .sb-footer{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#6f85a0;line-height:1.6;}   /* ---- MAIN ---- */  .main{flex:1;padding:22px 26px 40px;min-width:0;}  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;gap:12px;}
